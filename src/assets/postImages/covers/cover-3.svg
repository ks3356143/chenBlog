<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#102a2f"/>
			<stop offset="1" stop-color="#0b1d1a"/>
		</linearGradient>
		<pattern id="bands" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
			<rect width="60" height="120" fill="#ffffff" fill-opacity=".035"/>
		</pattern>
	</defs>
	<rect width="800" height="800" fill="url(#bg)"/>
	<rect width="800" height="800" fill="url(#bands)"/>
	<!-- 圆角递进：border-radius 的视觉母题 -->
	<g fill="#0dcaa9" fill-opacity=".16" stroke="#0dcaa9" stroke-opacity=".6" stroke-width="3">
		<rect x="90" y="330" width="140" height="140" rx="0"/>
		<rect x="255" y="330" width="140" height="140" rx="24"/>
		<rect x="420" y="330" width="140" height="140" rx="52"/>
		<rect x="585" y="330" width="140" height="140" rx="70"/>
	</g>
	<g fill="#ffffff" fill-opacity=".5">
		<rect x="90" y="545" width="140" height="8" rx="4"/>
		<rect x="255" y="545" width="140" height="8" rx="4"/>
		<rect x="420" y="545" width="140" height="8" rx="4"/>
		<rect x="585" y="545" width="140" height="8" rx="4"/>
	</g>
	<circle cx="160" cy="170" r="40" fill="#00ba99" fill-opacity=".65"/>
</svg>
