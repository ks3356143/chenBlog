<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#06232b"/>
			<stop offset="1" stop-color="#0f3138"/>
		</linearGradient>
		<linearGradient id="aurora" x1="0" y1="0" x2="1" y2=".4">
			<stop offset="0" stop-color="#0dcaa9" stop-opacity=".55"/>
			<stop offset=".55" stop-color="#5bd6c0" stop-opacity=".28"/>
			<stop offset="1" stop-color="#0dcaa9" stop-opacity="0"/>
		</linearGradient>
		<radialGradient id="glow" cx=".5" cy=".3" r=".7">
			<stop offset="0" stop-color="#0dcaa9" stop-opacity=".38"/>
			<stop offset="1" stop-color="#0dcaa9" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
			<path d="M50 0H0v50" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
		</pattern>
		<clipPath id="winA"><rect x="120" y="180" width="360" height="300" rx="18"/></clipPath>
		<clipPath id="winB"><rect x="300" y="330" width="380" height="320" rx="18"/></clipPath>
	</defs>
	<rect width="800" height="800" fill="url(#bg)"/>
	<rect width="800" height="800" fill="url(#grid)"/>
	<rect width="800" height="800" fill="url(#glow)"/>

	<!-- 底窗（日间玻璃）：只比底色亮一档，不能是白块 —— 第一版用 #e8f3ef 92% 太抢眼 -->
	<g>
		<rect x="300" y="330" width="380" height="320" rx="18" fill="#9fd8c8" fill-opacity=".22"/>
		<g clip-path="url(#winB)">
			<rect x="300" y="330" width="380" height="56" fill="#9fd8c8" fill-opacity=".18"/>
			<g stroke="#c9ece2" stroke-opacity=".55" stroke-width="7" stroke-linecap="round">
				<path d="M330 430h180"/><path d="M330 480h240"/><path d="M330 530h140"/>
			</g>
		</g>
		<rect x="300" y="330" width="380" height="320" rx="18" fill="none" stroke="#0dcaa9" stroke-opacity=".38" stroke-width="3"/>
	</g>

	<!-- 顶窗（深色极光 HUD） -->
	<g>
		<rect x="120" y="180" width="360" height="300" rx="18" fill="#08252a" fill-opacity=".95"/>
		<g clip-path="url(#winA)">
			<rect x="120" y="180" width="360" height="300" fill="url(#aurora)"/>
			<g stroke="#0dcaa9" stroke-opacity=".55" stroke-width="3">
				<rect x="152" y="238" width="120" height="70" rx="8"/>
				<rect x="292" y="238" width="152" height="70" rx="8" stroke-opacity=".3"/>
				<rect x="152" y="336" width="292" height="106" rx="8" stroke-opacity=".3"/>
			</g>
		</g>
		<rect x="120" y="180" width="360" height="300" rx="18" fill="none" stroke="#0dcaa9" stroke-opacity=".55" stroke-width="3"/>
	</g>
	<circle cx="655" cy="205" r="40" fill="#00ba99" fill-opacity=".6"/>
</svg>