<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0b2028"/>
			<stop offset="1" stop-color="#16343c"/>
		</linearGradient>
		<radialGradient id="glow" cx=".5" cy=".5" r=".62">
			<stop offset="0" stop-color="#0dcaa9" stop-opacity=".4"/>
			<stop offset="1" stop-color="#0dcaa9" stop-opacity="0"/>
		</radialGradient>
		<pattern id="dot" width="44" height="44" patternUnits="userSpaceOnUse">
			<circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity=".12"/>
		</pattern>
	</defs>
	<rect width="800" height="800" fill="url(#bg)"/>
	<rect width="800" height="800" fill="url(#dot)"/>
	<rect width="800" height="800" fill="url(#glow)"/>
	<!-- 连线：从四周收向中心 -->
	<g stroke="#0dcaa9" stroke-opacity=".28" stroke-width="2.5">
		<path d="M190 210 L400 400"/><path d="M640 180 L400 400"/>
		<path d="M150 540 L400 400"/><path d="M660 590 L400 400"/>
		<path d="M400 640 L400 400"/><path d="M235 380 L400 400"/>
	</g>
	<!-- 散落小卡 -->
	<g fill="none" stroke="#0dcaa9" stroke-opacity=".42" stroke-width="3">
		<rect x="148" y="168" width="86" height="76" rx="10"/>
		<rect x="596" y="138" width="86" height="76" rx="10" stroke-opacity=".28"/>
		<rect x="108" y="500" width="86" height="76" rx="10" stroke-opacity=".28"/>
		<rect x="618" y="552" width="86" height="76" rx="10"/>
		<rect x="356" y="600" width="86" height="76" rx="10" stroke-opacity=".28"/>
	</g>
	<!-- 中心：收束后的"库" -->
	<rect x="316" y="316" width="168" height="168" rx="20" fill="#0dcaa9" fill-opacity=".14" stroke="#0dcaa9" stroke-opacity=".65" stroke-width="3"/>
	<g stroke="#0dcaa9" stroke-opacity=".7" stroke-width="6" stroke-linecap="round">
		<path d="M352 366h96"/><path d="M352 400h72"/><path d="M352 434h84"/>
	</g>
	<circle cx="400" cy="400" r="228" fill="none" stroke="#0dcaa9" stroke-opacity=".14" stroke-width="2"/>
</svg>