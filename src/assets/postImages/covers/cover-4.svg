<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
	<defs>
		<linearGradient id="bg" x1="1" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0c2320"/>
			<stop offset="1" stop-color="#14343f"/>
		</linearGradient>
		<pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
			<circle cx="6" cy="6" r="2.6" fill="#ffffff" fill-opacity=".12"/>
		</pattern>
	</defs>
	<rect width="800" height="800" fill="url(#bg)"/>
	<rect width="800" height="800" fill="url(#dots)"/>
	<!-- 三次贝塞尔 + 控制柄：cubic-bezier 缓动的视觉母题 -->
	<g stroke="#0dcaa9" stroke-opacity=".45" stroke-width="2" stroke-dasharray="8 8" fill="none">
		<path d="M140 620 L300 250"/>
		<path d="M660 180 L500 550"/>
	</g>
	<path d="M140 620 C300 250 500 550 660 180" fill="none" stroke="#00ba99" stroke-width="7" stroke-linecap="round"/>
	<g fill="#0dcaa9">
		<circle cx="300" cy="250" r="13"/>
		<circle cx="500" cy="550" r="13"/>
	</g>
	<g fill="#ffffff" fill-opacity=".85">
		<circle cx="140" cy="620" r="10"/>
		<circle cx="660" cy="180" r="10"/>
	</g>
</svg>
