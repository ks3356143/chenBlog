<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0a232a"/>
			<stop offset="1" stop-color="#153a40"/>
		</linearGradient>
		<radialGradient id="glow" cx=".25" cy=".3" r=".6">
			<stop offset="0" stop-color="#0dcaa9" stop-opacity=".42"/>
			<stop offset="1" stop-color="#0dcaa9" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
			<path d="M50 0H0v50" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
		</pattern>
	</defs>
	<rect width="800" height="800" fill="url(#bg)"/>
	<rect width="800" height="800" fill="url(#grid)"/>
	<rect width="800" height="800" fill="url(#glow)"/>
	<!-- 左：docx 文档 -->
	<g fill="none" stroke="#0dcaa9" stroke-opacity=".55" stroke-width="3">
		<rect x="118" y="240" width="190" height="250" rx="14"/>
		<path d="M118 300h190" stroke-opacity=".3"/>
	</g>
	<g stroke="#0dcaa9" stroke-opacity=".38" stroke-width="6" stroke-linecap="round">
		<path d="M150 350h120"/><path d="M150 392h96"/><path d="M150 434h110"/>
	</g>
	<!-- 中：用例树（节点 + 分叉） -->
	<g stroke="#0dcaa9" stroke-opacity=".4" stroke-width="2.5" fill="none">
		<path d="M400 300 L400 360"/>
		<path d="M400 400 L330 470"/><path d="M400 400 L400 480"/><path d="M400 400 L470 470"/>
		<path d="M330 510 L330 560"/><path d="M470 510 L470 560"/>
	</g>
	<g fill="#0dcaa9">
		<circle cx="400" cy="290" r="16" fill-opacity=".7"/>
		<circle cx="330" cy="500" r="11" fill-opacity=".5"/>
		<circle cx="400" cy="500" r="11" fill-opacity=".5"/>
		<circle cx="470" cy="500" r="11" fill-opacity=".5"/>
		<circle cx="330" cy="572" r="8" fill-opacity=".32"/>
		<circle cx="470" cy="572" r="8" fill-opacity=".32"/>
	</g>
	<!-- 右：两份 Word -->
	<g fill="none" stroke="#0dcaa9" stroke-opacity=".5" stroke-width="3">
		<rect x="560" y="220" width="150" height="190" rx="12"/>
		<rect x="590" y="330" width="150" height="190" rx="12" stroke-opacity=".32"/>
	</g>
	<g stroke="#0dcaa9" stroke-opacity=".3" stroke-width="5" stroke-linecap="round">
		<path d="M590 272h90"/><path d="M590 306h60"/>
		<path d="M620 382h90"/><path d="M620 416h60"/>
	</g>
</svg>