<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0a2420"/>
			<stop offset="1" stop-color="#123a32"/>
		</linearGradient>
		<radialGradient id="glow" cx=".72" cy=".26" r=".6">
			<stop offset="0" stop-color="#0dcaa9" stop-opacity=".45"/>
			<stop offset="1" stop-color="#0dcaa9" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
			<path d="M50 0H0v50" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
		</pattern>
	</defs>
	<rect width="800" height="800" fill="url(#bg)"/>
	<rect width="800" height="800" fill="url(#grid)"/>
	<rect width="800" height="800" fill="url(#glow)"/>
	<!-- 文档卡片栈：三张错落，暗示「文档结构即数据模型」 -->
	<g fill="none" stroke="#0dcaa9" stroke-opacity=".5" stroke-width="3">
		<rect x="120" y="150" width="330" height="420" rx="16"/>
		<rect x="230" y="240" width="330" height="420" rx="16" stroke-opacity=".32"/>
		<rect x="340" y="330" width="330" height="420" rx="16" stroke-opacity=".2"/>
	</g>
	<!-- 卡片内的「字段行」 -->
	<g stroke="#0dcaa9" stroke-opacity=".35" stroke-width="6" stroke-linecap="round">
		<path d="M165 215h180"/>
		<path d="M165 265h240"/>
		<path d="M165 315h150"/>
		<path d="M165 365h200"/>
	</g>
	<circle cx="590" cy="200" r="42" fill="#00ba99" fill-opacity=".65"/>
	<circle cx="175" cy="645" r="12" fill="#ffffff" fill-opacity=".45"/>
</svg>