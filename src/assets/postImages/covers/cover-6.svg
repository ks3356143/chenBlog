<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0c2228"/>
			<stop offset="1" stop-color="#14383a"/>
		</linearGradient>
		<radialGradient id="glow" cx=".3" cy=".75" r=".62">
			<stop offset="0" stop-color="#0dcaa9" stop-opacity=".4"/>
			<stop offset="1" stop-color="#0dcaa9" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
			<path d="M50 0H0v50" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
		</pattern>
	</defs>
	<rect width="800" height="800" fill="url(#bg)"/>
	<rect width="800" height="800" fill="url(#grid)"/>
	<rect width="800" height="800" fill="url(#glow)"/>
	<!-- 时间轴：一条主色折线穿过四个节点，右端收在「存档」方块 -->
	<path d="M90 560 L240 430 L390 470 L540 320 L700 300" fill="none" stroke="#0dcaa9" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
	<g fill="#0dcaa9">
		<circle cx="90" cy="560" r="14" fill-opacity=".55"/>
		<circle cx="240" cy="430" r="14" fill-opacity=".7"/>
		<circle cx="390" cy="470" r="14" fill-opacity=".55"/>
		<circle cx="540" cy="320" r="14" fill-opacity=".7"/>
	</g>
	<!-- 存档箱 -->
	<g fill="none" stroke="#0dcaa9" stroke-opacity=".5" stroke-width="3">
		<rect x="620" y="230" width="130" height="140" rx="14"/>
		<path d="M620 285h130" stroke-opacity=".3"/>
	</g>
	<!-- 顶部版本刻度 -->
	<g stroke="#ffffff" stroke-opacity=".18" stroke-width="3" stroke-linecap="round">
		<path d="M110 165h60"/><path d="M200 165h100"/><path d="M330 165h40"/><path d="M400 165h160"/>
	</g>
	<circle cx="690" cy="640" r="36" fill="#00ba99" fill-opacity=".5"/>
</svg>